name: build-android

# บิลด์ APK จริงด้วย JDK (Temurin 21) + Gradle + Android SDK บน GitHub runner
# - กดเอง: Actions → "build-android" → Run workflow (ได้ APK ใน artifact + release `dev-apk`)
# - หรือ push tag v* เพื่อออก release ตามเวอร์ชัน
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Install web dependencies
        run: npm ci

      - name: Static mobile export (Next.js → out/)
        run: npm run build:mobile

      - name: Sync Capacitor android shell
        run: npx cap sync android

      - name: Build debug APK (./gradlew assembleDebug)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish dev release (stable download link)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-apk
          name: "Dev APK — ติดตั้งแบบ developer (อัปเดตอัตโนมัติ)"
          body: |
            APK debug สำหรับติดตั้งบนเครื่อง Android แบบ developer
            (ตั้งค่า → ติดตั้งแอปที่ไม่รู้จัก / หรือ adb install)
            บิลด์ล่าสุดจาก branch: ${{ github.ref_name }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
